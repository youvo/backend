services:
  paramconverter.uuid:
    class: Drupal\youvo\ParamConverter\UuidParamConverter
    tags:
      - { name: paramconverter }
    arguments:
      [ '@entity_type.manager', '@entity.repository' ]
  youvo.token_replacer:
    class: Drupal\youvo\SimpleTokenReplacer
    arguments: [ '@logger.channel.youvo' ]
  logger.channel.youvo:
    parent: logger.channel_base
    arguments: [ 'youvo' ]

  youvo.response_header:
    class: Drupal\youvo\EventSubscriber\HttpResponseHeaderSubscriber
    tags:
      - { name: event_subscriber }

  youvo.normalizer.datetime_iso8601:
    class: Drupal\youvo\Normalizer\DateOnlyDateTimeIso8601Normalizer
    decorates: serializer.normalizer.datetimeiso8601
    arguments: [ '@youvo.normalizer.datetime_iso8601.inner', '@config.factory' ]
