langcode: en
status: true
dependencies:
  module:
    - lifecycle
id: project_lifecycle
label: 'Project Lifecycle'
type: lifecycle
type_settings:
  states:
    draft:
      label: Draft
      weight: 0
    completed:
      label: Completed
      weight: 4
    ongoing:
      label: Ongoing
      weight: 3
    open:
      label: Open
      weight: 2
    pending:
      label: Pending
      weight: 1
    declined:
      label: Declined
      weight: 5
  transitions:
    decline:
      label: 'Project Decline'
      from:
        - draft
        - pending
      to: declined
      weight: 10
    complete:
      label: 'Project Complete'
      from:
        - ongoing
      to: completed
      weight: 7
    mediate:
      label: 'Project Mediate'
      from:
        - open
      to: ongoing
      weight: 5
    publish:
      label: 'Project Publish'
      from:
        - pending
      to: open
      weight: 3
    reset:
      label: 'Project Reset'
      from:
        - completed
        - declined
        - ongoing
        - open
        - pending
      to: draft
      weight: 9
    submit:
      label: 'Project Submit'
      from:
        - draft
      to: pending
      weight: 1
  initial_state: draft
