project.unarchive:
  path: '/projects/{project}/unarchive'
  defaults:
    _form: '\Drupal\projects\Form\ProjectUnarchiveForm'
    _title: 'Unarchive Project'
  requirements:
    _permission: 'unarchive projects'
    project: \d+
  options:
    _admin_route: TRUE
