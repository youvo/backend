services:

  plugin.manager.manager_context_panes:
    class: 'Drupal\manager\ManagerContextPanes'
    arguments:
      - '@container.namespaces'
      - '@cache.discovery'
      - '@module_handler'
  Drupal\manager\ManagerContextPanes: '@plugin.manager.manager_context_panes'

  plugin.manager.manager_rules:
    class: 'Drupal\manager\ManagerRules'
    arguments:
      - '@container.namespaces'
      - '@cache.discovery'
      - '@module_handler'
  Drupal\manager\ManagerRules: '@plugin.manager.manager_rules'

  manager.ajax_response_subscriber:
    class: Drupal\manager\EventSubscriber\AjaxResponseSubscriber
    tags:
      - { name: event_subscriber }

  manager.timeline_builder:
    class: Drupal\manager\Timeline\TimelineBuilder
    arguments:
      - '@entity_type.manager'
      - '@mailer.manager_mail_access'

  manager.form_once:
    class: Drupal\manager\Form\FormOnceGuard
    arguments:
      - '@keyvalue.expirable'
      - '@lock'

  manager.project_seen:
    class: Drupal\manager\ProjectSeenTracker
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@datetime.time'
      - '@cache_tags.invalidator'
  Drupal\manager\ProjectSeenTracker: '@manager.project_seen'
