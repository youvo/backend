manager.context_pane:
  path: '/project/manage/context/{project}'
  defaults:
    _controller: '\Drupal\manager\Controller\ContextPaneController::contextPane'
    _format: 'ajax'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      project:
        type: entity:project
    no_cache: 'TRUE'

manager.mediate_form:
  path: '/project/manage/mediate/{project}'
  defaults:
    _form: '\Drupal\manager\Form\ProjectMediateContextPaneForm'
    _title: 'Mediate Project'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      project:
        type: entity:project

manager.mail_form:
  path: '/project/manage/mail/{project}/{subtype}'
  defaults:
    _form: '\Drupal\manager\Form\ProjectMailForm'
    _title: 'Mail senden'
  requirements:
    _custom_access: 'mailer.manager_mail_access:access'
  options:
    parameters:
      project:
        type: entity:project

manager.note_add:
  path: '/project/manage/note/{project}'
  defaults:
    _form: '\Drupal\manager\Form\ProjectNoteForm'
    _title: 'Notiz hinzufügen'
  requirements:
    _custom_access: 'mailer.manager_mail_access:noteAccess'
  options:
    parameters:
      project:
        type: entity:project

manager.note_edit:
  path: '/project/manage/note/{correspondence}/edit'
  defaults:
    _form: '\Drupal\manager\Form\ProjectNoteForm'
    _title: 'Notiz bearbeiten'
  requirements:
    _custom_access: 'mailer.manager_mail_access:noteEntryAccess'
  options:
    parameters:
      correspondence:
        type: entity:correspondence

manager.note_delete:
  path: '/project/manage/note/{correspondence}/delete'
  defaults:
    _form: '\Drupal\manager\Form\ProjectNoteDeleteForm'
    _title: 'Notiz löschen'
  requirements:
    _custom_access: 'mailer.manager_mail_access:noteEntryAccess'
  options:
    parameters:
      correspondence:
        type: entity:correspondence
