manager.context_pane:
  path: '/project/manage/context/{project}'
  defaults:
    _controller: '\Drupal\manager\Controller\ContextPaneController::contextPane'
    _format: 'ajax'
  requirements:
    _permission: 'general manager access'
  options:
    parameters:
      project:
        type: entity:project
    no_cache: 'TRUE'

manager.mediate_form:
  path: '/project/manage/mediate/{project}'
  defaults:
    _form: '\Drupal\manager\Form\ProjectMediateContextPaneForm'
    _title: 'Mediate Project'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      project:
        type: entity:project

manager.project_seen:
  path: '/project/manage/seen/{project}'
  defaults:
    _controller: '\Drupal\manager\Controller\ProjectSeenController::seen'
  methods: [POST]
  requirements:
    _permission: 'general manager access'
    _custom_access: '\Drupal\manager\Controller\ProjectSeenController::access'
    _csrf_token: 'TRUE'
  options:
    parameters:
      project:
        type: entity:project

manager.project_seen_all:
  path: '/project/manage/seen'
  defaults:
    _controller: '\Drupal\manager\Controller\ProjectSeenController::seenAll'
  methods: [POST]
  requirements:
    _permission: 'general manager access'
    _csrf_token: 'TRUE'
