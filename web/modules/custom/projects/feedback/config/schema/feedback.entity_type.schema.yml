feedback.feedback_type.*:
  type: config_entity
  label: 'Feedback type config'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    uuid:
      type: string

field.formatter.settings.feedback_options:
  type: mapping
  label: 'Feedback options formatter settings'
  mapping:
    options:
      type: sequence
      label: 'Options'
      sequence:
        type: mapping
        label: 'Option'
        mapping:
          value:
            type: integer
            label: 'Value'
          label:
            type: label
            label: 'Label'
