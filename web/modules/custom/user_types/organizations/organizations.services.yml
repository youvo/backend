services:
  organizations.project_notify.event_subscriber:
    class: Drupal\organizations\EventSubscriber\OrganizationsProjectNotifySubscriber
    arguments:
      [ '@config.factory', '@language_manager', '@datetime.time', '@Drupal\user\OneTimeAuthentication' ]
    tags:
      - { name: event_subscriber }
  organizations.route_subscriber:
    class: Drupal\organizations\Routing\OrganizationsRouteSubscriber
    tags:
      - { name: event_subscriber }
