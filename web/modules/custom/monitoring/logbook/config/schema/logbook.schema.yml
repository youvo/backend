logbook.log_pattern.*:
  type: config_entity
  label: Log Pattern
  mapping:
    id:
      type: string
      label: 'Machine Name'
    label:
      type: label
    text:
      type: text
    public_text:
      type: text
      label: 'Public Text'
    tokens:
      type: sequence
      label: 'Tokens'
      sequence:
        type: mapping
        label: 'Token'
        mapping:
          token:
            type: string
            label: 'Token'
          required:
            type: boolean
            label: 'Required'
    status:
      type: boolean
      label: 'Enabled'
    detectable:
      type: boolean
      label: 'Detectable'
    observable:
      type: boolean
      label: 'Observable'
    public:
      type: boolean
      label: 'Public'
    promote:
      type: boolean
      label: 'Promote'
    hidden:
      type: boolean
      label: 'Hidden'
    color:
      type: string
      label: 'Color'
    tone:
      type: string
      label: 'Tone'

views.filter.log_pattern_scope:
  type: views.filter.in_operator
  label: 'Logbook: listed patterns'

views.filter.logbook_search:
  type: views_filter
  label: 'Logbook: Search'
  mapping:
    value:
      type: sequence
      label: 'Tokens'
      sequence:
        type: string
        label: 'Token'

views.argument.logbook_involves:
  type: views.argument.numeric
  label: 'Logbook: Involves'

views.pager.logbook_load_more:
  type: views_pager_sql
  label: 'Logbook: Load more'
  mapping:
    step:
      type: integer
      label: 'Items loaded with each click'

views.cache.logbook_tag:
  type: views.cache.tag
  label: 'Logbook tags'

views.area.logbook_empty:
  type: views_area
  label: 'Logbook: Empty'
