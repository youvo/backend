name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: 8.4
      - name: Validate Dependencies
        run: composer validate
      - name: Install Dependencies
        uses: ramsey/composer-install@v3
      - name: Check Coding Standards
        run: vendor/bin/phpcs --report=summary
      - name: Static Code Analysis
        run: vendor/bin/phpstan analyze web/modules/custom

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build Manager
        working-directory: web/modules/custom/projects/manager
        run: yarn install --frozen-lockfile && yarn build
      - name: Build Theme
        working-directory: web/themes/custom/yv
        run: yarn install --frozen-lockfile && yarn build
      - name: Build Mail Layout
        working-directory: web/themes/custom/yv/mjml
        run: npm ci && npm run build
      - name: Check Committed Build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "The committed build is out of date. Run the builds and commit the output."
            exit 1
          fi

  unit-kernel:
    name: Unit & Kernel Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: 8.4
      - name: Install Dependencies
        uses: ramsey/composer-install@v3
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          sudo systemctl start mysql.service
          mysql -uroot -h127.0.0.1 -proot -e 'CREATE DATABASE IF NOT EXISTS db;'
      - name: Unit & Kernel Tests
        run: vendor/bin/phpunit --testsuite unit,kernel --testdox --stop-on-failure

  existing-site:
    name: Existing Site Tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: unit-kernel
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: 8.4
      - name: Install Dependencies
        uses: ramsey/composer-install@v3
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          sudo systemctl start mysql.service
          mysql -uroot -h127.0.0.1 -proot -e 'CREATE DATABASE IF NOT EXISTS db;'
          sudo systemctl start apache2.service
      - name: Install Drupal
        run: bash scripts/install-ci.sh
      # Each shard installs its own site and runs every third test file.
      - name: Existing Site Tests
        run: |
          files=$(vendor/bin/phpunit --testsuite existing-site --list-test-files \
            | sed -n 's/^ - //p' | sort \
            | awk -v n=3 -v i=${{ matrix.shard }} 'NR % n == i % n')
          vendor/bin/phpunit --testdox --stop-on-failure $files
